<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soạn dữ liệu · Võ Lâm Yêu Nước</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #14161b; color: #d8d8d8; font: 13px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: #8a8d96; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #1f2229; border-bottom: 1px solid #2e3140; position: sticky; top: 0; z-index: 5; }
header .t { font-size: 16px; font-weight: 700; color: #f2c230; }
header .st { font-size: 12px; color: #8a8d96; margin-left: 10px; }
header .sp { margin-left: auto; }
.btn { background: #2e3140; color: #ddd; border: 0; border-radius: 6px; padding: 6px 12px; }
.btn:hover { background: #3a3f50; }
.btn.pri { background: #e8892c; color: #2a1404; font-weight: 600; }
.btn.pri:hover { background: #f39b40; }
.btn.danger { background: #4a1e1e; color: #ffb0a0; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.wrap { display: grid; grid-template-columns: 210px 1fr; gap: 12px; padding: 12px; }
nav { background: #1f2229; border-radius: 10px; padding: 8px; align-self: start; position: sticky; top: 62px; max-height: calc(100vh - 80px); overflow: auto; }
nav .g { color: #8a8d96; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 10px 6px 4px; }
nav .g:first-child { margin-top: 2px; }
nav button { display: flex; width: 100%; background: none; border: 0; color: #ccc; text-align: left; padding: 5px 8px; border-radius: 6px; }
nav button:hover { background: #2a2d38; }
nav button.on { background: #3a3f50; color: #fff; }
nav button .n { margin-left: auto; color: #777; font-size: 11px; }
main { min-width: 0; }
.sec-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.sec-head h2 { margin: 0; font-size: 17px; color: #fff; }
.help { background: #1f2229; border-left: 3px solid #f2c230; padding: 7px 10px; margin: 6px 0 10px; color: #b8bac2; font-size: 12.5px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.filters label { color: #8a8d96; font-size: 12px; display: flex; gap: 5px; align-items: center; }
.card { display: flex; gap: 10px; background: #1f2229; border: 1px solid #2a2d38; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.card .imgs { display: flex; flex-direction: column; gap: 6px; flex: none; }
.card .imgs.wide { flex-direction: row; flex-wrap: wrap; width: 250px; }
.card .body { flex: 1; min-width: 0; }
.card .head { font-weight: 600; color: #f2c230; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.card .head .acts { margin-left: auto; display: flex; gap: 4px; }
.fields { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.f { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: #8a8d96; }
.f.s { width: 80px; } .f.m { width: 150px; } .f.l { width: 240px; } .f.xl { width: 100%; }
.f input, .f select, .f textarea { background: #15171c; border: 1px solid #343846; border-radius: 5px; color: #fff; padding: 4px 6px; font: inherit; font-size: 13px; width: 100%; }
.f textarea { min-height: 46px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: #f2c230; }
.f input[type=color] { padding: 1px; height: 28px; }
.f input[type=checkbox] { width: auto; }
.tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 8px; margin-left: 4px; font-weight: 500; }
.tag.ok { background: #1e3a1e; color: #8fd88f; }
.tag.new { background: #3a2a10; color: #f2c230; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: #15171c; border: 1px solid #343846; color: #aaa; border-radius: 12px; padding: 2px 9px; font-size: 12px; }
.chip.on { background: #3a3218; border-color: #f2c230; color: #ffe08a; }
.lines { display: flex; flex-direction: column; gap: 4px; }
.line { display: flex; gap: 6px; align-items: center; }
.line select, .line input { background: #15171c; border: 1px solid #343846; border-radius: 5px; color: #fff; padding: 3px 6px; font: inherit; font-size: 12.5px; }
.line input { width: 80px; }
.line select { width: 260px; }
.line .x { background: none; border: 0; color: #a66; font-size: 15px; }
.lines .hd { display: flex; gap: 6px; font-size: 11px; color: #777; }
.img { width: 72px; height: 72px; border: 1px dashed #555; border-radius: 8px; background: #15171c center/contain no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10.5px; color: #777; position: relative; outline: none; }
.img.bg { width: 128px; height: 72px; background-size: cover; }
.img.has { border-style: solid; border-color: #3a3f50; color: transparent; }
.img.active { border: 2px solid #f2c230; }
.img .clr { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 9px; border: 0; background: #4a1e1e; color: #ffb0a0; font-size: 11px; line-height: 18px; padding: 0; display: none; }
.img.has .clr { display: block; }
.img-l { font-size: 10.5px; color: #777; text-align: center; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #3a3f50; color: #fff; padding: 7px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; }
#toast.on { opacity: 1; }
.empty { color: #777; padding: 20px; text-align: center; background: #1f2229; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <span class="t">Soạn dữ liệu · Võ Lâm Yêu Nước</span>
  <span class="st" id="status">Đang tải...</span>
  <span class="sp"></span>
  <button class="btn" id="b-open">Mở file gamedata.json</button>
  <button class="btn pri" id="b-export">Xuất gamedata.json</button>
  <button class="btn danger" id="b-reset">Về dữ liệu mẫu</button>
  <input type="file" id="f-open" accept=".json,application/json" class="hidden">
  <input type="file" id="f-img" accept="image/*" class="hidden">
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
// =====================================================================
// FORM NHẬP DỮ LIỆU — Võ Lâm Yêu Nước
// Tự lưu trên trình duyệt (IndexedDB). Xuất ra gamedata.json để gửi Claude / upload GitHub.
// =====================================================================

const uid = p => p + "_" + Math.random().toString(36).slice(2, 8);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------- Dữ liệu mẫu ----------------
const SKILL_SLOTS = [
  { id: "lmb", name: "Chuột trái · skill chính" },
  { id: "rmb", name: "Chuột phải · skill phụ" },
  { id: "p1",  name: "Bị động 1" },
  { id: "p2",  name: "Bị động 2" },
  { id: "q",   name: "Q · buff/debuff" }
];
const BOOST_ATTRS = [
  { id: "dmg", name: "Sát thương %" }, { id: "aspd", name: "Tốc đánh %" }, { id: "cd", name: "Hồi chiêu %" },
  { id: "size", name: "Vùng / kích thước %" }, { id: "dur", name: "Thời gian tác dụng %" }, { id: "count", name: "Số lượng (cộng thêm)" },
  { id: "mp", name: "Nội lực tiêu hao %" }, { id: "effectChance", name: "Tỉ lệ gây hiệu ứng %" },
  { id: "crit", name: "Chí mạng %" }, { id: "critdmg", name: "Sát thương chí mạng %" }
];
const BIKIP_TIERS = [{ id: "ha", name: "Hạ cấp" }, { id: "trung", name: "Trung cấp" }, { id: "cao", name: "Cao cấp" }];
const GOLD_TIERS = [{ id: "ha", name: "Hạ" }, { id: "trung", name: "Trung" }, { id: "thuong", name: "Thượng" }];
const DROP_SOURCES = [{ id: "mob", name: "Quái thường" }, { id: "boss", name: "Boss map" }, { id: "gold", name: "Boss Hoàng Kim" }];
const WEAPON_TYPES = [{ id: "dao", name: "Đao" }, { id: "kiem", name: "Kiếm" }, { id: "bong", name: "Bổng (Côn)" }, { id: "quyen", name: "Quyền (bao tay, chỉ)" }, { id: "phidao", name: "Phi Đao" }];
const MISC_KINDS = [{ id: "hp", name: "Hồi máu" }, { id: "mp", name: "Hồi nội lực" }, { id: "cure", name: "Giải hiệu ứng xấu" }, { id: "revive", name: "Hồi sinh" },
  { id: "ticket", name: "Vé boss Hoàng Kim" }, { id: "skillup", name: "Nâng cấp skill" }, { id: "reset", name: "Reset skill" },
  { id: "levelup", name: "Lên cấp ngay (Tuyết Liên)" }, { id: "newbie", name: "Lễ bao tân thủ" }, { id: "other", name: "Khác" }];
const MISC_SOURCES = [{ id: "shop", name: "Cửa hàng" }, { id: "boss", name: "Boss map" }, { id: "gold", name: "Boss Hoàng Kim" }];
const USE_IN = [{ id: "boss", name: "Đánh boss" }, { id: "pk", name: "PK" }, { id: "idle", name: "Treo máy" }];
const isUsable = it => ["hp", "mp", "cure", "revive"].includes(it.kind);

// Chỉ số gốc theo phái: giá trị cấp 1 + tăng mỗi cấp
const SECT_BASE = {
  thieulam: { hpBase: 260, hpLv: 55, mpBase: 80, mpLv: 6, atkBase: 18, atkLv: 5.5, defBase: 8, defLv: 3, mpRegen: 3, manaShield: 0, mpPerLv: 0.45, role: "Đỡ đòn: máu và phòng cao nhất, nội lực ít nhất." },
  duongmon: { hpBase: 190, hpLv: 38, mpBase: 110, mpLv: 12, atkBase: 23, atkLv: 7, defBase: 5, defLv: 2, mpRegen: 3, manaShield: 0, mpPerLv: 1.6, role: "Sát thương cao nhất, máu vừa." },
  vodang:   { hpBase: 160, hpLv: 30, mpBase: 200, mpLv: 25, atkBase: 20, atkLv: 6, defBase: 4, defLv: 1.5, mpRegen: 4, manaShield: 30, mpPerLv: 6.3, role: "Mana shield: nội lực nhiều nhất, máu mỏng nhất. 30% sát thương nhận vào trừ vào nội lực." },
  doanthi:  { hpBase: 200, hpLv: 40, mpBase: 140, mpLv: 16, atkBase: 21, atkLv: 6.5, defBase: 5, defLv: 2, mpRegen: 3.5, manaShield: 0, mpPerLv: 2.8, role: "Cân bằng." },
  caibang:  { hpBase: 230, hpLv: 48, mpBase: 90, mpLv: 9, atkBase: 22, atkLv: 6.5, defBase: 6, defLv: 2.5, mpRegen: 3, manaShield: 0, mpPerLv: 1.6, role: "Cận chiến bền, nội lực ít." }
};
const SECT_BASE_DEFAULT = { hpBase: 200, hpLv: 40, mpBase: 100, mpLv: 10, atkBase: 20, atkLv: 6, defBase: 5, defLv: 2, mpRegen: 3, manaShield: 0, mpPerLv: 1.5, role: "" };
function applySectBase(s) {
  const b = SECT_BASE[s.id] || SECT_BASE_DEFAULT;
  for (const k in b) {
    if (k === "role") { if (!s.desc) s.desc = b.role; }
    else if (s[k] === undefined) s[k] = b[k];
  }
  return s;
}

function defaultData() {
  const D = { meta: { app: "vlyn", kind: "gamedata", version: 2, updated: Date.now() } };

  D.settings = {
    counterBonus: 15, offlineHours: 24, invSize: 50, invMiscSize: 30, partyHpPer: 25, partyDmgPer: 10, skillGemMul: 1, skillExtraTiers: 3, skillExtraPoints: 2, skillExtraGemMul: 2, roomDummyHp: 2000000, netRate: 10,
    mobGoldMul: 75, mobGoldChance: 70, overLevelExpPer: 5, overLevelExpMax: 150, lotusGoldChance: 28, mapBossGoldChance: 2,
    newbieGems: 10, newbieHp: 10, newbieMp: 10, newbieWeaponLv: 10, newbieWeaponRar: 3,
    staminaMax: 100, staminaRegen: 3, dashStamina: 20, dashCd: 1.2,
    bossDmgMul: 2, bossBulletMul: 2, bossGapMul: 0.8, rageHpPct: 50, rageGapMul: 0.5, rageExtraPatterns: 2, resetRefund: 100, maxLevel: 99, expBase: 100, expPow: 2.2,
    mobDropChance: 12, maxOverLevel: 0, bikipMaxLv: 3,
    mpRegenFlat: 5, manaShieldRatio: 1, manaShieldCap: 80, reflectCap: 50,
    rules: "Qua boss map mới mở map kế tiếp. Bí kíp chỉ phái đó đọc được, phái khác bán lấy vàng. Đọc trùng bí kíp để lên cấp (tối đa 3). Skill chuột trái của mọi phái đều theo tốc đánh. Skill chuột phải có hồi chiêu cố định.",
    note: ""
  };

  D.elements = [
    { id: "kim", name: "Kim", color: "#f2c230", counters: "moc" },
    { id: "moc", name: "Mộc", color: "#4caf50", counters: "tho" },
    { id: "tho", name: "Thổ", color: "#b07a3c", counters: "thuy" },
    { id: "thuy", name: "Thủy", color: "#3f86e0", counters: "hoa" },
    { id: "hoa", name: "Hỏa", color: "#e04040", counters: "kim" }
  ];

  D.genders = [
    { id: "nam", name: "Nam", dmgBonus: 15, spread: 10, idleHit: 85, homing: false, note: "Sát thương cao, kém chính xác" },
    { id: "nu", name: "Nữ", dmgBonus: 0, spread: 3, idleHit: 95, homing: true, note: "Chính xác, đạn tự bám nhẹ" }
  ];

  D.sects = [
    { id: "thieulam", name: "Thiếu Lâm", element: "kim", robe: "#e8892c", enabled: true, path1: "Đường Đao", weapon1: "dao", path2: "Đường Côn", weapon2: "bong", desc: "", img: "" },
    { id: "duongmon", name: "Đường Môn", element: "moc", robe: "#3f9a4a", enabled: false, path1: "", weapon1: "", path2: "", weapon2: "", desc: "", img: "" },
    { id: "vodang", name: "Võ Đang", element: "tho", robe: "#9a7040", enabled: false, path1: "", weapon1: "", path2: "", weapon2: "", desc: "", img: "" },
    { id: "doanthi", name: "Đoàn Thị", element: "thuy", robe: "#3f7ad0", enabled: false, path1: "", weapon1: "", path2: "", weapon2: "", desc: "", img: "" },
    { id: "caibang", name: "Cái Bang", element: "hoa", robe: "#b04030", enabled: false, path1: "", weapon1: "", path2: "", weapon2: "", desc: "", img: "" }
  ];
  D.sects.forEach(applySectBase);

  const sk = (sect, path, slot, o = {}) => Object.assign({
    id: uid("sk"), sect, path, slot, name: "", mech: slot === "p1" || slot === "p2" ? "passive_skill" : "",
    maxLv: 10, aspd: slot === "lmb" ? 2 : 0, dmg: 0, dmgLv: 0, cd: 0, cdLv: 0, mp: 0,
    dur: 0, durLv: 0, size: 0, sizeLv: 0, count: 1, countLv: 0,
    effect: "", effectChance: 0, effectChanceLv: 0, target: "", boosts: [], stats: [],
    desc: "", note: "", img: ""
  }, o);
  D.skills = [];
  D.sects.forEach(s => [1, 2].forEach(p => SKILL_SLOTS.forEach(sl => D.skills.push(sk(s.id, p, sl.id)))));
  const find = (sect, path, slot) => D.skills.find(x => x.sect === sect && x.path === path && x.slot === slot);
  const daoL = find("thieulam", 1, "lmb"), daoR = find("thieulam", 1, "rmb");
  Object.assign(daoL, { name: "Nguyệt Đao Trảm", mech: "crescent", aspd: 2.5, dmg: 100, dmgLv: 12, size: 17, sizeLv: 3,
    desc: "Bắn trăng khuyết vàng bay thẳng. Lên cấp trăng to hơn. Tốc độ ra đòn theo tốc đánh." });
  Object.assign(daoR, { name: "Sư Tử Hống", mech: "cone", dmg: 230, dmgLv: 30, cd: 8, cdLv: 0.3, mp: 30, size: 250,
    desc: "Hét vùng tam giác trước mặt, gây sát thương và xóa đạn trong vùng. Hồi chiêu cố định, không theo tốc đánh." });
  Object.assign(find("thieulam", 1, "p1"), { name: "Nguyệt Ảnh Đao Pháp", mech: "passive_skill", target: daoL.id,
    boosts: [{ attr: "dmg", per: 5 }, { attr: "aspd", per: 4 }], desc: "Tăng sát thương và tốc đánh của Nguyệt Đao Trảm." });
  Object.assign(find("thieulam", 1, "p2"), { name: "Long Ngâm Công", mech: "passive_skill", target: daoR.id,
    boosts: [{ attr: "cd", per: -4 }, { attr: "size", per: 6 }], desc: "Giảm hồi chiêu và mở rộng vùng của Sư Tử Hống." });
  Object.assign(find("thieulam", 1, "q"), { name: "Phật Quang Phổ Chiếu", mech: "invuln", cd: 22, cdLv: 0.6, mp: 40, dur: 2, durLv: 0.15,
    desc: "Không nhận sát thương trong vài giây." });
  Object.assign(find("thieulam", 2, "lmb"), { name: "Phi Côn", mech: "staff_trap", aspd: 1.6, dmg: 80, dmgLv: 10, dur: 2, size: 60, count: 1, countLv: 0.5,
    desc: "Ném côn gây sát thương. Côn rơi xuống xoay tại chỗ gây sát thương vùng như bẫy. Lên cấp rơi được nhiều điểm cùng lúc." });

  D.bikip = [];
  D.sects.forEach(s => BIKIP_TIERS.forEach(t => D.bikip.push({ id: uid("bk"), sect: s.id, tier: t.id, name: "", maxLv: 3, stats: [], desc: "", img: "" })));
  Object.assign(D.bikip.find(b => b.sect === "thieulam" && b.tier === "ha"),
    { name: "Dịch Cân Kinh", stats: [{ stat: "hpPct", v1: 10, v2: 20, v3: 30 }], desc: "Ví dụ: tăng % máu (tính trên tổng sau khi mặc đồ)." });

  D.mechanics = [
    { id: "crescent", name: "Bắn trăng khuyết bay thẳng", done: true, note: "" },
    { id: "staff_trap", name: "Ném vật, rơi xuống xoay gây sát thương vùng (bẫy)", done: false, note: "" },
    { id: "cone", name: "Vùng tam giác trước mặt", done: true, note: "Có tùy chọn xóa đạn" },
    { id: "circle", name: "Vòng tròn quanh người", done: false, note: "" },
    { id: "orbit", name: "Vật xoay quanh người", done: false, note: "" },
    { id: "dash", name: "Lướt tới gây sát thương", done: false, note: "" },
    { id: "invuln", name: "Bất tử (không nhận sát thương)", done: false, note: "" },
    { id: "shield", name: "Khiên chặn đạn", done: true, note: "" },
    { id: "buff_stat", name: "Buff chỉ số có thời gian", done: false, note: "" },
    { id: "debuff_area", name: "Debuff vùng lên kẻ địch", done: false, note: "" },
    { id: "passive_skill", name: "Bị động: tăng cường skill khác", done: true, note: "" },
    { id: "passive_stat", name: "Bị động: tăng chỉ số", done: true, note: "" },
    { id: "other", name: "Khác (mô tả trong ghi chú)", done: false, note: "" },
    ...NEW_MECHS
  ];

  D.patterns = [
    { id: "ring", name: "Vòng đạn tỏa tròn", done: true, note: "" },
    { id: "fan", name: "Quạt đạn nhắm vào người", done: true, note: "" },
    { id: "spiral", name: "Xoắn ốc", done: true, note: "" },
    { id: "wall", name: "Tường đạn có khe hở", done: true, note: "" },
    { id: "big", name: "Cầu lớn bay chậm rồi nổ tung", done: true, note: "" },
    { id: "charge", name: "Lao vào người chơi", done: true, note: "" },
    { id: "rain", name: "Mưa đạn từ trên xuống", done: false, note: "" },
    { id: "summon", name: "Triệu hồi quái con", done: false, note: "" },
    { id: "zone", name: "Vùng cảnh báo rồi nổ", done: false, note: "" },
    { id: "laser", name: "Tia quét", done: false, note: "" }
  ];

  const st = (id, name, unit, group, done = false, note = "") => ({ id, name, unit, group, done, note });
  D.stats = [
    st("atk", "Công", "số", "Cơ bản", true), st("hp", "Máu", "số", "Cơ bản", true), st("mp", "Nội lực", "số", "Cơ bản", true),

// ---------------- Lưu tự động (IndexedDB) ----------------
const DB = {
  open() { return new Promise((ok, no) => { const r = indexedDB.open("vlyn-editor", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((ok, no) => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((ok, no) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => ok(); t.onerror = () => no(t.error); }); }
};
let saveT = null;
function changed() {
  DATA.meta.updated = Date.now();
  $("status").textContent = "Đang lưu...";
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      await DB.set("data", DATA);
      const kb = Math.round(JSON.stringify(DATA).length / 1024);
      $("status").textContent = `Đã tự lưu ${new Date().toLocaleTimeString("vi-VN")} · ${kb.toLocaleString("vi-VN")} KB`;
    } catch (e) { $("status").textContent = "Lỗi lưu: " + e.message; }
    renderNav();
  }, 600);
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

// Bổ sung trường còn thiếu khi mở file cũ
function upgrade(d) {
  const def = defaultData();
  for (const k in def) {
    if (d[k] === undefined) d[k] = def[k];
    else if (k === "settings") d[k] = Object.assign({}, def.settings, d.settings);
  }
  d.meta = Object.assign({}, def.meta, d.meta);
  if ((d.meta.version || 1) < 2) {
    // Bản 2: thêm chỉ số mới, dòng phụ mới, đổi độc/lửa sang "tổng trong X giây"
    const add = (list, items, key) => items.forEach(x => { if (!d[list].some(y => y[key] === x[key])) d[list].push(x); });
    add("stats", def.stats, "id");
    add("affixes", def.affixes.filter(a => ["reflect", "manaShield", "manasteal", "bulletConvert", "allSkills"].includes(a.stat)), "stat");
    const ren = { burnDmg: ["Sát thương Hỏa (đốt máu mỗi giây)", "Sát thương Hỏa (tổng trong 3 giây)"], poisonDmg: ["Sát thương Độc (mỗi giây)", "Sát thương Độc (tổng trong 10 giây)"] };
    d.stats.forEach(s => { if (ren[s.id] && s.name === ren[s.id][0]) s.name = ren[s.id][1]; });
    const ep = d.effects.find(e => e.id === "poison");
    if (ep && ep.valueNote === "Mất máu mỗi giây theo Sát thương Độc") { ep.valueNote = "Tổng Sát thương Độc chia đều trong 10 giây"; if (ep.dur === 5) ep.dur = 10; }
    const eb = d.effects.find(e => e.id === "burn");
    if (eb && eb.valueNote === "Mất máu mỗi giây theo Sát thương Hỏa") eb.valueNote = "Tổng Sát thương Hỏa chia đều trong 3 giây";
    d.slots.forEach(s => { if ((s.id === "weapon" || s.id === "armor") && !(s.main || []).includes("allSkills")) (s.main = s.main || []).push("allSkills"); });
    d.meta.version = 2;
  }
  d.goldBosses.forEach(b => { if (b.goldItemChance === undefined) b.goldItemChance = 10; });
  // Vũ khí của đường: chữ cũ ("Đao", "Côn (Bổng)"...) đổi sang mã loại vũ khí
  const wmap = t => /phi/iu.test(t) ? "phidao" : /đao/iu.test(t) ? "dao" : /kiếm/iu.test(t) ? "kiem" : /côn|bổng/iu.test(t) ? "bong" : /quyền|chỉ|chưởng|tay/iu.test(t) ? "quyen" : "";
  d.sects.forEach(s => ["weapon1", "weapon2"].forEach(k => { if (s[k] && !WEAPON_TYPES.some(w => w.id === s[k])) s[k] = wmap(s[k]); }));
  d.sects.forEach(applySectBase);
  // Bản 2.1: hình đạn cho skill, cơ chế mới
  d.skills.forEach(k => {
    ["fxA", "fxB", "fxF1", "fxF2", "fxF3", "fxF4"].forEach(f => { if (k[f] === undefined) k[f] = ""; });
    if (k.fxARot === undefined) k.fxARot = 0; if (k.fxBRot === undefined) k.fxBRot = 0; if (!k.fxTint) k.fxTint = "none";
  });
  NEW_MECHS.forEach(m => { if (!d.mechanics.some(x => x.id === m.id)) d.mechanics.push({ ...m }); });
  return d;
}

// ---------------- Render ----------------
function listOf(sec) { return sec.single ? [DATA[sec.key]] : DATA[sec.key]; }
function visible(sec) {
  const f = filterState[sec.key] || {};
  return listOf(sec).filter(it => (sec.filters || []).every(fl => f[fl.k] === undefined || f[fl.k] === "" || String(it[fl.k]) === String(f[fl.k])));
}

function renderNav() {
  let g = "", html = "";
  SECTIONS.forEach(s => {
    if (s.group !== g) { g = s.group; html += `<div class="g">${g}</div>`; }
    const n = s.single ? "" : DATA[s.key].length;
    html += `<button data-sec="${s.key}" class="${s.key === cur ? "on" : ""}">${s.title}<span class="n">${n}</span></button>`;
  });
  $("nav").innerHTML = html;
}

function optionsHtml(opts, val, blank) {
  let has = false;
  let h = blank ? `<option value="">${esc(blank)}</option>` : "";
  h += opts.map(o => { const sel = String(o.v) === String(val); if (sel) has = true; return `<option value="${esc(o.v)}" ${sel ? "selected" : ""}>${esc(o.t)}</option>`; }).join("");
  if (!has && val !== "" && val != null && !blank) h += `<option value="${esc(val)}" selected>${esc(val)} (không có trong danh sách)</option>`;
  return h;
}

function fieldHtml(f, it) {
  const v = it[f.k];
  let inner = "";
  switch (f.t) {
    case "text": inner = `<input data-k="${f.k}" value="${esc(v)}">`; break;
    case "num": inner = `<input data-k="${f.k}" type="number" step="any" value="${v ?? 0}">`; break;
    case "color": inner = `<input data-k="${f.k}" type="color" value="${esc(v || "#ffffff")}">`; break;
    case "check": inner = `<input data-k="${f.k}" type="checkbox" ${v ? "checked" : ""}>`; break;
    case "area": inner = `<textarea data-k="${f.k}">${esc(v)}</textarea>`; break;
    case "select": inner = `<select data-k="${f.k}">${optionsHtml(f.o(it), v, f.blank)}</select>`; break;
    case "multi": {
      const set = new Set(v || []);
      inner = `<div class="chips">${f.o(it).map(o => `<button type="button" class="chip ${set.has(o.v) ? "on" : ""}" data-multi="${f.k}" data-v="${esc(o.v)}">${esc(o.t)}</button>`).join("")}</div>`;
      break;
    }
    case "lines": {
      const rows = (v || []).map((row, i) => `<div class="line">${f.cols.map(c => c.t === "select"
        ? `<select data-line="${f.k}" data-i="${i}" data-c="${c.k}">${optionsHtml(c.o(it), row[c.k])}</select>`
        : `<input data-line="${f.k}" data-i="${i}" data-c="${c.k}" type="number" step="any" value="${row[c.k] ?? 0}" title="${esc(c.l)}">`).join("")}
        <button type="button" class="x" data-delline="${f.k}" data-i="${i}" title="Xóa dòng">✕</button></div>`).join("");
      inner = `<div class="lines">${(v || []).length ? `<div class="hd">${f.cols.map(c => `<span style="width:${c.t === "select" ? "260px" : "80px"}">${esc(c.l)}</span>`).join("")}</div>` : ""}
        ${rows}<div><button type="button" class="btn sm" data-addline="${f.k}">+ Thêm dòng</button></div></div>`;
      break;
    }
  }
  return `<label class="f ${f.w || "m"}"><span>${esc(f.l)}</span>${inner}</label>`;
}

function cardHtml(sec, it) {
  const imgs = (sec.imgs || []).map(im => {
    const src = it[im.k];
    return `<div><div class="img ${im.kind === "bg" ? "bg" : ""} ${src ? "has" : ""}" tabindex="0" data-img="${im.k}" data-kind="${im.kind || "icon"}"
      style="${src ? `background-image:url(${src})` : ""}" title="Bấm chọn rồi Ctrl+V để dán ảnh, kéo thả file vào, hoặc bấm đúp để chọn file">
      Dán ảnh<br>Ctrl+V<button type="button" class="clr" data-clrimg="${im.k}" title="Xóa ảnh">✕</button></div><div class="img-l">${esc(im.l)}</div></div>`;
  }).join("");
  const fields = sec.fields.filter(f => !f.show || f.show(it)).map(f => fieldHtml(f, it)).join("");
  const acts = sec.single || sec.noAdd ? "" : `<span class="acts"><button type="button" class="btn sm" data-dup="1">Nhân bản</button><button type="button" class="btn sm danger" data-del="1">Xóa</button></span>`;
  return `<div class="card" data-id="${esc(it.id || "settings")}">${imgs ? `<div class="imgs${sec.imgsWide ? " wide" : ""}">${imgs}</div>` : ""}
    <div class="body"><div class="head"><span class="ht">${sec.head(it)}</span>${acts}</div><div class="fields">${fields}</div></div></div>`;
}

function renderMain() {
  const sec = SEC[cur];
  const f = filterState[cur] || {};
  const filters = (sec.filters || []).map(fl => `<label>${esc(fl.l)} <select data-filter="${fl.k}">
      <option value="">Tất cả</option>${fl.o({}).map(o => `<option value="${esc(o.v)}" ${String(f[fl.k]) === String(o.v) ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select></label>`).join("");
  const items = visible(sec);
  $("main").innerHTML = `<div class="sec-head"><h2>${sec.title}</h2>${sec.single || sec.noAdd ? "" : `<button class="btn sm pri" id="b-add">+ Thêm</button>`}</div>
    <div class="help">${esc(sec.help)}</div>${filters ? `<div class="filters">${filters}</div>` : ""}
    <div id="cards">${items.length ? items.map(it => cardHtml(sec, it)).join("") : `<div class="empty">Chưa có dòng nào.</div>`}</div>`;
  activeImg = null;
}

function findItem(id) { const sec = SEC[cur]; return sec.single ? DATA[sec.key] : DATA[sec.key].find(x => x.id === id); }
function rerenderCard(card) {
  const sec = SEC[cur], it = findItem(card.dataset.id);
  const tmp = document.createElement("div"); tmp.innerHTML = cardHtml(sec, it);
  card.replaceWith(tmp.firstElementChild);
}

// ---------------- Sự kiện ----------------
$("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-sec]"); if (!b) return;
  cur = b.dataset.sec; renderNav(); renderMain(); window.scrollTo(0, 0);
});

$("main").addEventListener("input", e => {
  const el = e.target, card = el.closest(".card");
  if (el.dataset.filter !== undefined) return;
  if (!card) return;
  const it = findItem(card.dataset.id), sec = SEC[cur];
  if (el.dataset.k) {
    const f = sec.fields.find(x => x.k === el.dataset.k);
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (f.t === "num") v = el.value === "" ? 0 : Number(el.value);
    if (f.t === "select" && typeof (f.o(it)[0] || {}).v === "number") v = Number(v);
    it[f.k] = v;
    changed();
    if (f.rr && e.type === "input" && (f.t === "select" || f.t === "check")) rerenderCard(card);
    else card.querySelector(".ht").innerHTML = sec.head(it);
  } else if (el.dataset.line) {
    const f = sec.fields.find(x => x.k === el.dataset.line);
    const col = f.cols.find(c => c.k === el.dataset.c);
    it[f.k][+el.dataset.i][col.k] = col.t === "num" ? Number(el.value || 0) : el.value;
    changed();
  }
});
$("main").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.filter !== undefined) {
    const sec = SEC[cur], fl = sec.filters.find(x => x.k === el.dataset.filter);
    filterState[cur] = filterState[cur] || {};
    const sample = fl.o({})[0];
    filterState[cur][fl.k] = el.value === "" ? "" : (sample && typeof sample.v === "number" ? Number(el.value) : el.value);
    renderMain(); return;
  }
  const card = el.closest(".card"); if (!card || !el.dataset.k) return;
  const f = SEC[cur].fields.find(x => x.k === el.dataset.k);
  if (f && f.rr && f.t !== "select" && f.t !== "check") rerenderCard(card);
});

$("main").addEventListener("click", e => {
  const t = e.target, card = t.closest(".card"), sec = SEC[cur];
  if (t.id === "b-add") {
    const it = sec.newItem(filterState[cur] || {});
    DATA[sec.key].push(it); changed(); renderMain();
    const c = document.querySelector(`.card[data-id="${it.id}"]`); if (c) { c.scrollIntoView({ block: "center" }); const i = c.querySelector("input"); if (i) i.focus(); }
    return;
  }
  if (!card) return;
  const it = findItem(card.dataset.id);
  if (t.dataset.del) {
    if (!confirm(`Xóa "${it.name || "dòng này"}"?`)) return;
    DATA[sec.key] = DATA[sec.key].filter(x => x !== it); changed(); renderMain(); return;
  }
  if (t.dataset.dup) {
    const copy = JSON.parse(JSON.stringify(it)); copy.id = uid(sec.key.slice(0, 3)); copy.name = (copy.name || "") + " (bản sao)";
    DATA[sec.key].splice(DATA[sec.key].indexOf(it) + 1, 0, copy); changed(); renderMain(); return;
  }
  if (t.dataset.multi) {
    const arr = it[t.dataset.multi] = it[t.dataset.multi] || [];
    const raw = t.dataset.v, i = arr.findIndex(x => String(x) === raw);
    if (i >= 0) arr.splice(i, 1); else arr.push(raw);
    t.classList.toggle("on"); changed(); return;
  }
  if (t.dataset.addline) {
    const f = sec.fields.find(x => x.k === t.dataset.addline);
    const row = {}; f.cols.forEach(c => row[c.k] = c.t === "select" ? (c.o(it)[0] || {}).v : 0);
    (it[f.k] = it[f.k] || []).push(row); changed(); rerenderCard(card); return;
  }
  if (t.dataset.delline) { it[t.dataset.delline].splice(+t.dataset.i, 1); changed(); rerenderCard(card); return; }
  if (t.dataset.clrimg) { e.stopPropagation(); it[t.dataset.clrimg] = ""; changed(); rerenderCard(card); return; }
  const im = t.closest("[data-img]");
  if (im) selectImg(im);
});
$("main").addEventListener("dblclick", e => {
  const im = e.target.closest("[data-img]"); if (!im) return;
  selectImg(im); $("f-img").value = ""; $("f-img").click();
});
$("f-img").addEventListener("change", e => { const f = e.target.files[0]; if (f && activeImg) applyImage(f); });

function selectImg(el) {
  document.querySelectorAll(".img.active").forEach(x => x.classList.remove("active"));
  el.classList.add("active"); el.focus();
  activeImg = { id: el.closest(".card").dataset.id, k: el.dataset.img, kind: el.dataset.kind };
}

document.addEventListener("paste", e => {
  if (!activeImg) return;
  const items = [...(e.clipboardData || {}).items || []];
  const img = items.find(i => i.type.startsWith("image/"));
  if (!img) {
    if (document.activeElement && document.activeElement.matches(".img")) toast("Trong bộ nhớ không có ảnh. Hãy copy chính tấm ảnh (chuột phải → Sao chép hình ảnh), không phải link.");
    return;
  }
  e.preventDefault();
  applyImage(img.getAsFile());
});
$("main").addEventListener("dragover", e => { if (e.target.closest("[data-img]")) e.preventDefault(); });
$("main").addEventListener("drop", e => {
  const im = e.target.closest("[data-img]"); if (!im) return;
  e.preventDefault(); selectImg(im);
  const f = [...e.dataTransfer.files].find(x => x.type.startsWith("image/"));
  if (f) applyImage(f); else toast("Chỉ nhận file ảnh.");
});

// Cắt/thu nhỏ ảnh: icon 128×128 và hình nhân vật 256×256 (giữ tỉ lệ, nền trong suốt), hình nền 960×540 (cắt cho đầy)
// Hình đạn: cắt sát phần trong suốt, thu về tối đa 64px, giữ tỉ lệ (vẽ nhẹ trong trận)
function fxImageUrl(bmp) {
  const t = document.createElement("canvas"); t.width = bmp.width; t.height = bmp.height;
  const tc = t.getContext("2d"); tc.drawImage(bmp, 0, 0);
  const px = tc.getImageData(0, 0, t.width, t.height).data;
  let x1 = t.width, y1 = t.height, x2 = -1, y2 = -1;
  for (let y = 0; y < t.height; y++) for (let x = 0; x < t.width; x++) {
    if (px[(y * t.width + x) * 4 + 3] > 15) { if (x < x1) x1 = x; if (x > x2) x2 = x; if (y < y1) y1 = y; if (y > y2) y2 = y; }
  }
  if (x2 < 0) { x1 = 0; y1 = 0; x2 = t.width - 1; y2 = t.height - 1; }
  const w = x2 - x1 + 1, h = y2 - y1 + 1, s = Math.min(1, 64 / Math.max(w, h));
  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
  const c = cv.getContext("2d"); c.imageSmoothingQuality = "high";
  c.drawImage(t, x1, y1, w, h, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL("image/webp", 0.9);
  if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/png");
  return url;
}

async function applyImage(file) {
  const target = activeImg; if (!target) return;
  try {
    const bmp = await createImageBitmap(file);
    if (target.kind === "fx") {
      const url = fxImageUrl(bmp), it = findItem(target.id);
      if (!it) return;
      it[target.k] = url; changed();
      const card = document.querySelector(`.card[data-id="${target.id}"]`);
      if (card) { rerenderCard(card); const el = document.querySelector(`.card[data-id="${target.id}"] [data-img="${target.k}"]`); if (el) selectImg(el); }
      toast(`Đã dán hình đạn (${Math.round(url.length / 1024)} KB)`);
      return;
    }
    const icon = target.kind !== "bg";
    const W = target.kind === "sprite" ? 256 : icon ? 128 : 960, H = target.kind === "sprite" ? 256 : icon ? 128 : 540;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const c = cv.getContext("2d");
    c.imageSmoothingQuality = "high";
    const s = icon ? Math.min(W / bmp.width, H / bmp.height) : Math.max(W / bmp.width, H / bmp.height);
    const w = bmp.width * s, h = bmp.height * s;
    c.drawImage(bmp, (W - w) / 2, (H - h) / 2, w, h);
    let url = cv.toDataURL("image/webp", icon ? 0.9 : 0.82);
    if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/png");
    const it = findItem(target.id);
    if (!it) return;
    it[target.k] = url; changed();
    const card = document.querySelector(`.card[data-id="${target.id}"]`);
    if (card) { rerenderCard(card); const el = document.querySelector(`.card[data-id="${target.id}"] [data-img="${target.k}"]`); if (el) selectImg(el); }
    toast(`Đã dán ảnh (${Math.round(url.length / 1024)} KB)`);
  } catch (err) { toast("Không đọc được ảnh: " + err.message); }
}

// ---------------- Xuất / mở file ----------------
$("b-export").onclick = () => {
  DATA.meta.updated = Date.now();
  const blob = new Blob([JSON.stringify(DATA, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "gamedata.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Đã xuất gamedata.json");
};
$("b-open").onclick = () => { $("f-open").value = ""; $("f-open").click(); };
$("f-open").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.meta || d.meta.app !== "vlyn" || d.meta.kind !== "gamedata") throw new Error("Không phải file gamedata.json của game");
    if (!confirm("Mở file này sẽ thay toàn bộ dữ liệu đang có trong form. Tiếp tục?")) return;
    DATA = upgrade(d); changed(); renderNav(); renderMain(); toast("Đã mở " + f.name);
  } catch (err) { alert("Không mở được: " + err.message); }
});
$("b-reset").onclick = () => {
  if (!confirm("Xóa hết dữ liệu đang soạn và quay về dữ liệu mẫu? Nên Xuất gamedata.json để sao lưu trước.")) return;
  DATA = defaultData(); changed(); renderNav(); renderMain();
};

// ---------------- Khởi động ----------------
(async () => {
  try { const d = await DB.get("data"); DATA = d ? upgrade(d) : defaultData(); }
  catch (e) { DATA = defaultData(); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  renderNav(); renderMain();
  $("status").textContent = "Dữ liệu tự lưu trên trình duyệt này. Nhớ Xuất gamedata.json để sao lưu.";
})();
</script>
